[project]
name = "hotel-cancellation-prediction"
version = "1.1.0"
description = "End-to-end analysis and cancellation-prediction model for the Hotel Booking Demand dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Pantea Mokhtari" }]
keywords = [
    "data-analysis",
    "machine-learning",
    "hotel-bookings",
    "cancellation-prediction",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "notebook>=7.0",
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.6",
]

[project.urls]
Homepage = "https://github.com/panteamkhh/hotel-cancellation-prediction"
Repository = "https://github.com/panteamkhh/hotel-cancellation-prediction"
Issues = "https://github.com/panteamkhh/hotel-cancellation-prediction/issues"
Changelog = "https://github.com/panteamkhh/hotel-cancellation-prediction/blob/main/CHANGELOG.md"

[project.scripts]
hotel-pipeline = "src.run_pipeline:run"
hotel-analysis = "src.run_analysis:run"
hotel-train = "src.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '\.ipynb$'

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
